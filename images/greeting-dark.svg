      <stop offset="50%" stop-color="#ff7eb3" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <style>
      .text-base { fill: #f0f6fc; }
      .text-accent { fill: url(#aksar-grad-dark); }
